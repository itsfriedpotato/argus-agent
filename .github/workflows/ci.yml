name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pinned Circle CLI for the hosted-adapter tests (no login, no credentials)
        run: npm install --prefix .cache/argus-agent/circle-runtime --ignore-scripts --no-audit --no-fund @circle-fin/cli@1.1.4
      - run: node scripts/argus-agent/patch-circle-hosted.mjs
      - name: Anvil for the local EVM batch test
        if: runner.os == 'Linux'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: solc for the local EVM batch test
        if: runner.os == 'Linux'
        run: npm install --prefix .cache/argus-agent/test-runtime/solc --ignore-scripts --no-audit --no-fund solc@0.8.30
      - name: Tests (fixtures only; nothing signs or submits)
        run: npm test
      - name: Pack, install outside the checkout and smoke-test the CLI and MCP server
        run: npm run test:package -- --offline
